spring.application.name=exam-service
server.port=${EXAM_SERVICE_PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret=${AUTH_JWT_SECRET}
security.jwt.issuer=${AUTH_JWT_ISSUER}

# Question Service URL
services.question-service.url=${QUESTION_SERVICE_URL}