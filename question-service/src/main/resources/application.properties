spring.application.name=question-service
server.port=${QUESTION_SERVICE_PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=false

# Redis configuration
spring.data.redis.url=${REDIS_URL}
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.connect-timeout=2s

# Cache configuration
spring.cache.type=redis

spring.docker.compose.enabled=false

security.jwt.secret=${AUTH_JWT_SECRET}
security.jwt.issuer=${AUTH_JWT_ISSUER}
security.jwt.expiration-seconds=900

services.internal.key=${INTERNAL_SERVICE_KEY}