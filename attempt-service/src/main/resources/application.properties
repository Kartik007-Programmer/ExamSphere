spring.application.name=attempt-service
server.port=${ATTEMPT_SERVICE_PORT}

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.zone-offset-minutes=330
attempts.auto-submit.interval-ms=15000
attempts.auto-submit.initial-delay-ms=5000
attempts.auto-submit.batch-size=200

security.jwt.secret=${AUTH_JWT_SECRET}
security.jwt.issuer=${AUTH_JWT_ISSUER}
services.internal.key=${INTERNAL_SERVICE_KEY}

services.exam-service.url=${EXAM_SERVICE_URL:http://localhost:8083}
services.question-service.url=${QUESTION_SERVICE_URL}