server.port=${API_GATEWAY_SERVICE_PORT}

spring.application.name=api-gateway

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# Question Service
spring.cloud.gateway.server.webflux.routes[1].id=question-service
spring.cloud.gateway.server.webflux.routes[1].uri=${QUESTION_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/questions/**

# Exam Service
spring.cloud.gateway.server.webflux.routes[2].id=exam-service
spring.cloud.gateway.server.webflux.routes[2].uri=${EXAM_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/exams/**

# Attempt Service
spring.cloud.gateway.server.webflux.routes[3].id=attempt-service
spring.cloud.gateway.server.webflux.routes[3].uri=${ATTEMPT_SERVICE_URL}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/attempts/**

# Management / Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
